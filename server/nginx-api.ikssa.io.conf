# /etc/nginx/sites-available/api.ikssa.io  (symlink into sites-enabled)
# Serves the PHP API from /var/www/iksdashboard via PHP-FPM 8.5.
server {
    listen 80;
    server_name api.ikssa.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.ikssa.io;

    ssl_certificate     /etc/letsencrypt/live/api.ikssa.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ikssa.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/iksdashboard;
    autoindex off;

    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location = /sync.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 180s;
    }
    location = /migrate_from_sheet.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 180s;
    }
    location / {
        return 404;
    }
}
